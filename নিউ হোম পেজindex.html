<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FM App — Premium UI</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Outfit:wght@200..800&display=swap" rel="stylesheet">
<!-- Cropper.js CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">

<style>
:root{
  --bg-0:#031215;
  --bg-1:#061c21;
  --panel:#0a272d;
  --panel-2:#0d3037;

  --gold-1:#fff8dc;
  --gold-2:#f4dc8a;
  --gold-3:#d4af37;
  --gold-4:#9c7418;
  --gold-grad: linear-gradient(115deg,#fff8dc 0%,#f4dc8a 16%,#d4af37 34%,#8a6318 50%,#d4af37 66%,#f7e79c 84%,#fff8dc 100%);

  --teal:#20e3b2;
  --text:#eaf6f6;
  --muted:#7fa3a6;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}

body{
  font-family:'Outfit','Hind Siliguri',sans-serif;
  background:
    radial-gradient(900px 600px at 50% -10%, #0d3b42 0%, transparent 60%),
    radial-gradient(700px 500px at 110% 100%, #123c33 0%, transparent 55%),
    #031215;
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:0;
  overflow-x:hidden;
}

/* ============ APP SHELL ============ */
.app-container{
  width:100%;
  max-width:430px;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  padding-bottom:110px;
  background:
    radial-gradient(600px 320px at 50% -5%, rgba(32,227,178,.10), transparent 65%),
    radial-gradient(500px 400px at 100% 40%, rgba(212,175,55,.06), transparent 60%),
    linear-gradient(180deg,#061c21 0%,#04161a 55%,#031114 100%);
  box-shadow:0 0 80px rgba(0,0,0,.8);
}

.app-container::before{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(212,175,55,.18), transparent 30%, transparent 75%, rgba(212,175,55,.12));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  padding:1px; pointer-events:none; z-index:5;
}

/* ============ TOP BAR ============ */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 20px 14px;
  position:relative;
  z-index:6;
}

.profile-wrap{display:flex; align-items:center; gap:12px}

.avatar-ring{
  width:48px;height:48px;
  border-radius:50%;
  padding:2px;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 7s ease infinite;
  box-shadow:0 0 18px rgba(212,175,55,.35);
  flex-shrink:0;
}
.avatar-ring img{
  width:100%;height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
  border:2px solid #061c21;
}

.greet{display:flex;flex-direction:column;line-height:1.15}
.greet .hi{
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:500;
}
.greet .name{
  font-size:15px;
  font-weight:600;
  background:var(--gold-grad);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldShift 7s ease infinite;
}
.greet .uid {
  font-size: 10px;
  color: var(--teal);
  letter-spacing: 0.05em;
  font-weight: 500;
}

.head-actions{display:flex;gap:10px}

.icon-btn{
  width:40px;height:40px;
  display:grid;place-items:center;
  border-radius:14px;
  font-size:16px;
  color:#cfe9e8;
  background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid rgba(212,175,55,.22);
  backdrop-filter:blur(10px);
  cursor:pointer;
  transition:.25s;
}
.icon-btn:hover{
  color:#fff;
  border-color:rgba(212,175,55,.6);
  box-shadow:0 0 18px rgba(212,175,55,.25);
  transform:translateY(-2px);
}

/* ============ GOLD FRAME ============ */
.gold-frame{
  position:relative;
  padding:1px;
  border-radius:24px;
  background:var(--gold-grad);
  background-size:220% 220%;
  animation:goldShift 8s ease infinite;
  box-shadow:
    0 0 0 1px rgba(212,175,55,.06),
    0 18px 40px rgba(0,0,0,.55),
    0 0 28px rgba(212,175,55,.10);
  cursor: pointer;
}

@keyframes goldShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

/* ============ FM BANNER ============ */
.banner-container{padding:4px 16px 0;}

.fm-banner{
  border-radius:23px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  background:
    radial-gradient(220px 120px at 0% 0%, rgba(32,227,178,.16), transparent 70%),
    radial-gradient(200px 140px at 100% 100%, rgba(212,175,55,.10), transparent 70%),
    linear-gradient(160deg,#0c2f35 0%,#071e23 100%);
  position:relative;
  overflow:hidden;
  transition:transform .25s;
}
.fm-banner:active{transform:scale(.985)}

.fm-banner::after{
  content:"";
  position:absolute; top:0; left:-60%;
  width:45%; height:100%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.10), transparent);
  transform:skewX(-18deg);
  animation:sweep 5.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes sweep{
  0%{left:-60%}
  55%{left:130%}
  100%{left:130%}
}

.vinyl{
  position:relative;
  width:58px;height:58px;
  flex-shrink:0;
  display:grid;place-items:center;
}
.vinyl .ring{
  position:absolute; inset:0;
  border-radius:50%;
  padding:2px;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 6s ease infinite;
  box-shadow:0 0 16px rgba(212,175,55,.35);
}
.vinyl .disc{
  position:absolute; inset:3px;
  border-radius:50%;
  background:
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,.055) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 50% 50%, #14424a 0%, #061a1e 72%);
  animation:spin 6s linear infinite;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.vinyl .disc img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  animation: spin 6s linear infinite;
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0.8;
}
.vinyl .disc::after{
  content:"";
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.13) 45deg, transparent 95deg, transparent 190deg, rgba(212,175,55,.22) 235deg, transparent 290deg);
  z-index: 2;
  pointer-events: none;
}
@keyframes spin{to{transform:rotate(360deg)}}

.vinyl-label{
  position:relative;
  z-index:3;
  font-size:11px;
  font-weight:800;
  letter-spacing:.06em;
  background:var(--gold-grad);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 12px rgba(212,175,55,.5);
}

.banner-info{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}

.live-row{
  display:flex; align-items:center; gap:6px;
  font-size:9px; font-weight:700;
  letter-spacing:.2em; text-transform:uppercase;
  color:#ff6b6b;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:#ff4d4d;
  box-shadow:0 0 0 0 rgba(255,77,77,.7);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,77,.65)}
  70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}
  100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}
}

.fm-banner .title{
  font-size:14.5px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#ffffff;
}
.fm-banner .subtitle{
  font-size:11px;
  color:#a9cdcd;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.fm-banner .listeners{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:10.5px;
  font-weight:600;
  color:var(--teal);
  margin-top:1px;
}
.fm-banner .listeners i{font-size:9px}

.mine-btn{
  flex-shrink:0;
  position:relative;
  border:none;
  cursor:pointer;
  padding:9px 16px;
  border-radius:14px;
  font-family:inherit;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#1a1405;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 6s ease infinite;
  box-shadow:0 6px 18px rgba(212,175,55,.35), inset 0 1px 0 rgba(255,255,255,.6);
  transition:.25s;
  z-index:3;
}
.mine-btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(212,175,55,.5), inset 0 1px 0 rgba(255,255,255,.7)}
.mine-btn:active{transform:translateY(0) scale(.97)}

.banner-progress{
  position:absolute;
  left:14px; right:14px; bottom:0;
  height:2px;
  border-radius:2px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
  pointer-events:none;
}
.banner-progress span{
  display:block;
  height:100%;
  width:38%;
  border-radius:2px;
  background:var(--gold-grad);
  background-size:200% 100%;
  animation:goldShift 5s ease infinite;
}

/* ============ TABS ============ */
.tab-section{
  display:flex;
  align-items:center;
  gap:26px;
  padding:22px 22px 14px;
}

.tab{
  position:relative;
  font-size:15px;
  font-weight:600;
  color:var(--muted);
  cursor:pointer;
  padding-bottom:8px;
  transition:.25s;
  display:flex;
  align-items:center;
  gap:6px;
  background:none;
  border:none;
  font-family:inherit;
}
.tab:hover{color:#bcd9d8}

.tab.active{
  color:#fff;
  font-size:17px;
  font-weight:700;
}
.tab.active::after{
  content:"";
  position:absolute;
  left:0; bottom:0;
  width:100%; height:2px;
  border-radius:2px;
  background:var(--gold-grad);
  background-size:200% 100%;
  animation:goldShift 5s ease infinite;
  box-shadow:0 0 12px rgba(212,175,55,.75);
}
.tab .fire{
  font-size:13px;
  filter:drop-shadow(0 0 6px rgba(255,140,0,.8));
}

/* ============ TAB VIEWS ============ */
.tab-view{display:none}
.tab-view.active{display:block}

/* ===== HOT ===== */
.hot-frame-wrap{
  padding:0 16px;
}
.hot-frame-box{
  position:relative;
  border-radius:22px;
  overflow:hidden;
  background:#082024;
  box-shadow:
    0 0 0 1px rgba(212,175,55,.14),
    0 18px 40px rgba(0,0,0,.55),
    0 0 28px rgba(212,175,55,.10);
  min-height: 420px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  background: radial-gradient(400px 300px at 50% 0%, rgba(32,227,178,.1), transparent 70%),
              linear-gradient(180deg, #082024 0%, #04161a 100%);
}

.hot-banner-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  width: 100%;
}
.hot-banner-content .hot-icon {
  font-size: 40px;
  color: var(--gold-2);
  filter: drop-shadow(0 0 15px rgba(212,175,55,.5));
}
.hot-banner-content h2 {
  font-size: 20px;
  color: #fff;
  font-weight: 700;
  letter-spacing: 1px;
}
.hot-banner-content p {
  font-size: 13px;
  color: var(--muted);
  max-width: 250px;
  line-height: 1.6;
}
.hot-banner-content .hot-link-btn {
  margin-top: 10px;
  padding: 12px 30px;
  border-radius: 14px;
  background: var(--gold-grad);
  color: #1a1405;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  box-shadow: 0 6px 20px rgba(212,175,55,.4);
  transition: .3s;
  border: none;
  cursor: pointer;
}
.hot-banner-content .hot-link-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(212,175,55,.6);
}

/* ============ GRID ============ */
.grid-container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:0 16px;
}

.room-card{
  border-radius:22px;
  cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  animation:fadeUp .45s ease both;
}
.room-card:hover{
  transform:translateY(-5px);
  box-shadow:
    0 0 0 1px rgba(212,175,55,.10),
    0 22px 45px rgba(0,0,0,.6),
    0 0 34px rgba(212,175,55,.22);
}
@keyframes fadeUp{
  from{opacity:0; transform:translateY(12px)}
  to{opacity:1; transform:translateY(0)}
}

.card-inner{
  position:relative;
  border-radius:21px;
  overflow:hidden;
  background:#082024;
  aspect-ratio:1/1.12;
}

.card-inner img{
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
  filter:saturate(1.05) contrast(1.05);
}
.room-card:hover .card-inner img{transform:scale(1.07)}

.card-overlay{
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(3,18,21,.55) 0%, transparent 32%, transparent 42%, rgba(3,18,21,.92) 100%);
}

.card-top{
  position:absolute;
  top:9px; left:9px; right:9px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:6px;
}
.badge-top{
  font-size:8.5px;
  font-weight:800;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:4px 8px;
  border-radius:8px;
  color:#1a1405;
  background:var(--gold-grad);
  background-size:200% 200%;
  animation:goldShift 6s ease infinite;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
}
.badge-live{
  display:flex;align-items:center;gap:4px;
  font-size:8.5px;font-weight:700;letter-spacing:.1em;
  padding:4px 8px;border-radius:8px;
  color:#ffd9d9;
  background:rgba(200,30,30,.35);
  border:1px solid rgba(255,90,90,.45);
  backdrop-filter:blur(6px);
}
.badge-live i{font-size:5px}

.room-info{
  position:absolute;
  left:0; right:0; bottom:0;
  padding:10px 11px 11px;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.room-title{
  font-size:12.5px;
  font-weight:600;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.9);
}
.room-stats{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.tag{
  font-size:9px;
  font-weight:600;
  letter-spacing:.04em;
  padding:3px 8px;
  border-radius:999px;
  color:#f4dc8a;
  background:rgba(212,175,55,.12);
  border:1px solid rgba(212,175,55,.38);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:70px;
}
.count{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  font-weight:700;
  color:var(--teal);
  text-shadow:0 0 10px rgba(32,227,178,.4);
}
.count i{font-size:8.5px}

/* ============ SKELETON / EMPTY ============ */
.skeleton{
  border-radius:22px;
  background:linear-gradient(110deg,#0a272d 8%,#0d3037 18%,#0a272d 33%);
  background-size:200% 100%;
  animation:shimmer 1.4s linear infinite;
  aspect-ratio:1/1.12;
  border:1px solid rgba(212,175,55,.10);
}
@keyframes shimmer{to{background-position:-200% 0}}

.empty-state{
  grid-column:1 / -1;
  text-align:center;
  padding:60px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.empty-state .empty-icon{
  width:78px;height:78px;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:30px;
  color:var(--gold-2);
  background:linear-gradient(160deg, rgba(212,175,55,.18), rgba(212,175,55,.03));
  border:1px solid rgba(212,175,55,.35);
  box-shadow:0 0 30px rgba(212,175,55,.18);
}
.empty-state h3{
  font-size:16px;
  color:#fff;
  font-weight:600;
}
.empty-state p{
  font-size:12.5px;
  color:var(--muted);
  line-height:1.6;
  max-width:260px;
}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;
  bottom:0; left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg, rgba(6,28,33,.72), rgba(3,17,20,.96));
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  z-index:50;
}
.bottom-nav::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:1px;
  background:var(--gold-grad);
  background-size:200% 100%;
  animation:goldShift 8s ease infinite;
  opacity:.55;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  text-decoration:none;
  color:#5d868a;
  font-size:10px;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  transition:.25s;
  position:relative;
  padding:2px 12px;
  cursor:pointer;
}
.nav-item .nav-icon{
  position:relative;
  display:grid;
  place-items:center;
  width:40px;height:34px;
  border-radius:12px;
  font-size:18px;
  transition:.25s;
}
.nav-item:hover{color:#9dc3c4}

.nav-item.active{color:var(--gold-2)}
.nav-item.active .nav-icon{
  background:linear-gradient(160deg, rgba(212,175,55,.20), rgba(212,175,55,.05));
  border:1px solid rgba(212,175,55,.4);
  box-shadow:0 0 20px rgba(212,175,55,.28), inset 0 1px 0 rgba(255,255,255,.10);
  color:#f4dc8a;
}
.nav-item.active::after{
  content:"";
  position:absolute;
  top:-13px; left:50%;
  transform:translateX(-50%);
  width:24px;height:2px;
  border-radius:2px;
  background:var(--gold-grad);
  background-size:200% 100%;
  animation:goldShift 5s ease infinite;
  box-shadow:0 0 12px rgba(212,175,55,.9);
}

.badge{
  position:absolute;
  top:-3px; right:2px;
  min-width:16px;height:16px;
  padding:0 4px;
  display:grid;place-items:center;
  border-radius:999px;
  font-size:9px;
  font-weight:800;
  font-style:normal;
  color:#fff;
  background:linear-gradient(145deg,#ff5b5b,#c81e1e);
  border:1.5px solid #062026;
  box-shadow:0 0 10px rgba(255,70,70,.7);
}

/* ============ MODAL (POPUP) ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; place-items: center; z-index: 1000; padding: 20px;
  backdrop-filter: blur(8px);
}
.modal-overlay.show { display: grid; }
.modal-card {
  background: var(--panel); border: 1px solid var(--gold-3);
  border-radius: 24px; padding: 24px; width: 100%; max-width: 350px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 30px rgba(212,175,55,0.2);
  animation: fadeUp 0.3s ease;
}
.modal-card h3 { color: var(--gold-2); font-size: 18px; text-align: center; margin-bottom: 5px; font-weight: 700; }
.modal-card label { font-size: 12px; color: var(--muted); font-weight: 600; }
.modal-card input[type="text"], .modal-card select {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(212,175,55,0.3);
  border-radius: 12px; padding: 12px; color: #fff; outline: none;
  font-family: inherit; font-size: 14px; transition: 0.3s; width: 100%;
}
.modal-card input[type="text"]:focus, .modal-card select:focus { border-color: var(--gold-2); box-shadow: 0 0 10px rgba(212,175,55,0.3); }
.modal-card select option { background: #0a272d; color: #fff; }
.modal-card input[readonly] { background: rgba(212,175,55,0.1); color: var(--gold-2); font-weight: 700; text-align: center; }

/* Custom Upload Box */
.upload-box {
  width: 100px; height: 100px; margin: 0 auto;
  border: 2px dashed rgba(212,175,55,0.5);
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; overflow: hidden;
  background: rgba(255,255,255,0.02); transition: 0.3s;
}
.upload-box:hover { border-color: var(--gold-2); background: rgba(212,175,55,0.05); }
.upload-box .fa-plus { font-size: 28px; color: var(--gold-2); }
.upload-box img { width: 100%; height: 100%; object-fit: cover; display: none; }

.modal-btn-group { display: flex; gap: 10px; margin-top: 10px; }
.modal-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; transition: 0.3s; }
.modal-btn.submit { background: var(--gold-grad); color: #1a1405; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }
.modal-btn.submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212,175,55,0.6); }
.modal-btn.cancel { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
.modal-btn.cancel:hover { background: rgba(255,255,255,0.2); }

/* Cropper Modal specific */
#cropperModal { z-index: 2000; }
#cropperModal .modal-card { max-width: 90%; }
#cropperImage { width: 100%; display: block; border-radius: 12px; max-height: 400px; object-fit: contain; }

::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<div class="app-container">

  <!-- ===== TOP BAR ===== -->
  <div class="top-bar">
    <div class="profile-wrap">
      <div class="avatar-ring">
        <img id="userAvatar" src="https://i.pravatar.cc/120?img=12" alt="profile">
      </div>
      <div class="greet">
        <span class="name" id="userNameDisplay">User Name</span>
        <span class="uid" id="userIdDisplay">UID: 123456</span>
      </div>
    </div>

    <div class="head-actions">
      <div class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="icon-btn"><i class="fa-regular fa-bell"></i></div>

  <!-- ===== FM BANNER ===== -->
  <div class="banner-container">
    <div class="gold-frame" id="bannerBorder">

        <div class="vinyl" id="vinylArea">

  </div>

  <!-- ===== HOT VIEW ===== -->
  <div class="tab-view active" id="view-hot">
    <div class="hot-frame-wrap">
      <div class="hot-frame-box">
        <div class="hot-banner-content">
          <i class="fa-solid fa-fire hot-icon"></i>
          <h2>Hot Room List</h2>
          <p>আপনার পছন্দের হট রুমগুলো এখানে দেখানো হবে। নিচের বাটনে ক্লিক করে হট রুমে প্রবেশ করুন।</p>
          <a href="https://farjanaaktar1173-boop.github.io/Hot-room/" target="_blank" class="hot-link-btn">
            <i class="fa-solid fa-arrow-right"></i> Enter Hot Room
          </a>
        </div>
      </div>

  </div>

  <!-- ===== FOLLOWING VIEW ===== -->
  <div class="tab-view" id="view-following">
    <div class="grid-container" id="roomsGrid">
      <div class="skeleton"></div>
      <div class="skeleton"></div>

      <div class="skeleton"></div>

  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav class="bottom-nav">
    <a href="javascript:void(0)" class="nav-item active" id="navRoom">
      <span class="nav-icon"><i class="fa-solid fa-house"></i></span>
      <span>Room</span>
    </a>
    <a href="javascript:void(0)" class="nav-item" id="navChat">
      <span class="nav-icon">
        <i class="fa-solid fa-comment-dots"></i>
        <em class="badge">4</em>
      </span>
      <span>Messages</span>
    </a>
    <a href="javascript:void(0)" class="nav-item" id="navMe">
      <span class="nav-icon"><i class="fa-regular fa-user"></i></span>
      <span>Me</span>
    </a>
  </nav>

</div>

<!-- ===================== MAIN MODAL (POPUP) ===================== -->

  <div class="modal-card">

    <!-- Profile Name Removed -->

      <option value="🇦🇪 UAE">🇦🇪 UAE</option>
      <option value="🇸🇦 Saudi Arabia">🇸🇦 Saudi Arabia</option>
      <option value="🇲🇾 Malaysia">🇲🇾 Malaysia</option>
      <option value="🇸🇬 Singapore">🇸🇬 Singapore</option>
      <option value="🇨🇦 Canada">🇨🇦 Canada</option>
      <option value="🇦🇺 Australia">🇦🇺 Australia</option>

      <option value="🇰🇷 South Korea">🇰🇷 South Korea</option>

  <div class="modal-card">
    <h3><i class="fa-solid fa-crop"></i> Crop Image</h3>

      <img id="cropperImage" src="" alt="To Crop">
    </div>
    <div class="modal-btn-group">
      <button class="modal-btn cancel" id="cropCancelBtn">Cancel</button>
      <button class="modal-btn submit" id="cropSaveBtn">Crop & Save</button>
    </div>
  </div>
</div>

<!-- ===================== LINKS + FIREBASE ===================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
import {
  getDatabase, ref, onValue, query, orderByChild, set
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import Cropper from "https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.esm.js";

/* ---------- 🔗 YOUR LINKS ---------- */
const LINKS = {
  ownerRoom : "https://farjanaaktar1173-boop.github.io/Owner-room/",
  hotRoom   : "https://farjanaaktar1173-boop.github.io/Hot-room/",
  chat      : "https://farjanaaktar1173-boop.github.io/Chat/",
  me        : "https://farjanaaktar1173-boop.github.io/Me/",
  mineBtn   : "https://farjanaaktar1173-boop.github.io/Owner-room/" 
};

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:34c6f63269aaf659b2b8b9",
  measurementId: "G-EG726ZPVK7"
};
const app = initializeApp(firebaseConfig);
try { getAnalytics(app); } catch(e) {}
const db  = getDatabase(app);

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

/* ---------- User Info Placeholder ---------- */
const user = { 
    name: "User Name", 
    uid: "123456",     
    photo: "https://i.pravatar.cc/120?img=12" 
};

(function loadUser(){
  $("userNameDisplay").textContent = user.name;
  $("userIdDisplay").textContent = "UID: " + user.uid;
  $("userAvatar").src = user.photo;
  $("vinylProfileImg").src = user.photo;
})();

/* ============================================================
   IMAGE UPLOAD & CROPPING LOGIC
   ============================================================ */
let cropper;
const imageInput = $("modalImgInput");
const cropperModal = $("cropperModal");
const cropperImage = $("cropperImage");
const cropSaveBtn = $("cropSaveBtn");
const cropCancelBtn = $("cropCancelBtn");
const uploadBox = $("uploadBox");
const croppedPreview = $("croppedPreview");

// Open file selector on upload box click
uploadBox.addEventListener('click', () => imageInput.click());

// Handle file selection
imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            cropperImage.src = event.target.result;
            cropperModal.classList.add('show');
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropperImage, {
                aspectRatio: 1, // Square crop
                viewMode: 1,
                background: false,
                autoCropArea: 0.8
            });
        };
        reader.readAsDataURL(file);
    }
});

// Handle Crop Save
cropSaveBtn.addEventListener('click', () => {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
    const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
    
    croppedPreview.src = croppedDataUrl;
    croppedPreview.style.display = 'block';
    uploadBox.querySelector('.fa-plus').style.display = 'none';
    
    cropperModal.classList.remove('show');
    cropper.destroy();
    cropper = null;
});

// Handle Crop Cancel
cropCancelBtn.addEventListener('click', () => {
    cropperModal.classList.remove('show');
    if (cropper) {
        cropper.destroy();
        cropper = null;
    }
    imageInput.value = ''; // Reset input
});

/* ============================================================
   MODAL OPEN & UID GENERATION
   ============================================================ */
let currentRoomUid = "";

function generateUid() {
    // Generate 6-digit unique ID
    currentRoomUid = Math.floor(100000 + Math.random() * 900000).toString();
    $("modalRoomUid").value = currentRoomUid;
}

$("bannerBorder").addEventListener("click", (e) => {
  if (e.target.closest("#mineBtn")) return;
  generateUid(); // Generate UID every time modal opens
  $("roomModal").classList.add("show");
});

$("modalCloseBtn").addEventListener("click", () => {
  $("roomModal").classList.remove("show");
});

/* ============================================================
   SUBMIT TO FIREBASE & REDIRECT (Guaranteed Redirect)
   ============================================================ */
$("modalSubmitBtn").addEventListener("click", () => {
  const groupName = $("modalGroupName").value.trim();
  const country = $("modalCountry").value;
  const croppedImgBase64 = croppedPreview.src;

  if (!groupName) {
    alert("অনুগ্রহ করে গ্রুপের নাম দিন।");
    return;
  }

  // Prepare data for Firebase
  const roomData = {
    groupName: groupName,
    country: country || "Unknown",
    roomUid: currentRoomUid,
    image: croppedImgBase64 || "",
    createdAt: Date.now()
  };

  // UI আপডেট
  if (croppedImgBase64) {
    $("vinylProfileImg").src = croppedImgBase64;
    $("userAvatar").src = croppedImgBase64;
  }
  $("bannerTitle").textContent = "📻 " + groupName;
  if (country) $("bannerSubtitle").textContent = country;

  // মডাল বন্ধ
  $("roomModal").classList.remove("show");

  // ১. ফায়ারবেসে সেভ করা শুরু করুন (ব্যাকগ্রাউন্ডে, যাতে রিডাইরেক্ট ব্লক না হয়)
  try {
    set(ref(db, 'rooms/' + currentRoomUid), roomData)
      .then(() => console.log("✅ Firebase Save Successful"))
      .catch((error) => console.error("❌ Firebase Save Error:", error));
  } catch (e) {
    console.error("❌ Synchronous Firebase Error:", e);
  }

  // ২. ২০০ মিলিসেকেন্ড পর নির্দিষ্ট লিংকে রিডাইরেক্ট করুন (গ্যারান্টিড)
  setTimeout(() => {
    window.location.href = "https://farjanaaktar1173-boop.github.io/Owner-room/";
  }, 200);
});

/* ============================================================
   MINE BUTTON
   ============================================================ */
$("mineBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  location.href = LINKS.mineBtn;
});

/* ============================================================
   TABS (Hot / Following)
   ============================================================ */
let activeTab = "hot";
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;

    $("view-hot").classList.toggle("active", activeTab === "hot");
    $("view-following").classList.toggle("active", activeTab === "following");
  });
});

/* ============================================================
   FOLLOWING — Firebase rooms
   ============================================================ */
const grid = $("roomsGrid");
let allRooms = [];

function renderEmpty(msg="কোনো রুম নেই।", sub="আপনি এখনো কোনো রুম ফলো করেননি।"){
  grid.innerHTML = `
    <div class="empty-state">
      <div class="empty-icon"><i class="fa-solid fa-tower-broadcast"></i></div>
      <h3>${esc(msg)}</h3>
      <p>${esc(sub)}</p>
    </div>`;
}

function roomCardHTML(room){
  const title     = esc(room.groupName || room.title || "Untitled Room");
  const tag       = esc(room.country || room.tag || "Room"); // Changed from profileName to country
  const badge     = room.badge ? `<span class="badge-top">${esc(room.badge)}</span>` : "";
  const isLive    = room.isLive !== false;
  const liveBadge = isLive ? `<span class="badge-live"><i class="fa-solid fa-circle"></i>LIVE</span>` : "";
  const listeners = Number(room.listeners ?? room.users ?? 0);
  const img       = room.image || `https://picsum.photos/400/460?random=${encodeURIComponent(room.roomUid || room.id)}`;

  return `
    <div class="room-card gold-frame" data-id="${esc(room.roomUid || room.id)}">
      <div class="card-inner">
        <img src="${esc(img)}" alt="${title}" loading="lazy"
             onerror="this.onerror=null;this.src='https://picsum.photos/400/460?random=${encodeURIComponent(room.roomUid || room.id)}'">
        <div class="card-overlay"></div>
        <div class="card-top">${badge}${liveBadge}</div>
        <div class="room-info">
          <div class="room-title">${title}</div>
          <div class="room-stats">
            <span class="tag">${tag}</span>
            <span class="count"><i class="fa-solid fa-droplet"></i> ${formatCount(listeners)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function formatCount(n){
  n = Number(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'') + 'M';
  if (n >= 1000)    return (n/1000).toFixed(2).replace(/\.00$/,'') + 'K';
  return String(n);
}

const roomsQuery = query(ref(db, "rooms"), orderByChild("listeners"));
onValue(roomsQuery, (snap) => {
  const data = snap.val() || {};
  allRooms = Object.entries(data)
    .map(([id, v]) => ({ id, ...(v || {}) }))
    .sort((a,b) => (Number(b.listeners ?? b.users ?? 0)) - (Number(a.listeners ?? a.users ?? 0)));

  const list = user.following && user.following.length
    ? allRooms.filter(r => user.following.includes(r.id))
    : [];

  if (!list.length){
    renderEmpty("কোনো Follow রুম নেই।", "Hot ট্যাবে গিয়ে পছন্দের রুম ফলো করুন।");
  } else {
    grid.innerHTML = list.map(roomCardHTML).join("");
  }
}, (err) => {
  console.error("Firebase error:", err);
  renderEmpty("ডেটা লোড হয়নি।", "ইন্টারনেট চেক করুন।");
});

grid.addEventListener("click", (e) => {
  const card = e.target.closest(".room-card");
  if (!card) return;
  const roomId = card.dataset.id;
  if (!roomId) return;
  location.href = `${LINKS.ownerRoom}?id=${encodeURIComponent(roomId)}`;
});

/* ============================================================
   BOTTOM NAV LINKS
   ============================================================ */
$("navChat").addEventListener("click", () => location.href = LINKS.chat);
$("navMe").addEventListener("click", () => location.href = LINKS.me);
$("navRoom").addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));

</script>

</body>
</html>
