<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MOI — Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Outfit:wght@200..800&display=swap" rel="stylesheet">
<style>
:root{--bg-0:#031215;--panel:#0a272d;--gold-2:#f4dc8a;--gold-3:#d4af37;
  --gold-grad:linear-gradient(115deg,#fff8dc 0%,#f4dc8a 16%,#d4af37 34%,#8a6318 50%,#d4af37 66%,#f7e79c 84%,#fff8dc 100%);
  --teal:#20e3b2;--text:#eaf6f6;--muted:#7fa3a6;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit','Hind Siliguri',sans-serif;
  background:radial-gradient(900px 600px at 50% -10%,#0d3b42 0%,transparent 60%),#031215;
  color:var(--text);min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
.app-container{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;padding-bottom:110px;
  background:linear-gradient(180deg,#061c21 0%,#04161a 55%,#031114 100%);box-shadow:0 0 80px rgba(0,0,0,.8)}

/* TOP BAR */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 14px;position:relative;z-index:6}
.profile-wrap{display:flex;align-items:center;gap:12px}
.avatar-ring{width:48px;height:48px;border-radius:50%;padding:2px;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 7s ease infinite;flex-shrink:0}
.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #061c21}
.greet{display:flex;flex-direction:column;line-height:1.15}
.greet .name{font-size:15px;font-weight:600;background:var(--gold-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShift 7s ease infinite}
.greet .uid{font-size:10px;color:var(--teal);font-weight:500;margin-top:2px}
.head-actions{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;font-size:16px;color:#cfe9e8;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.22);cursor:pointer;transition:.25s}
.icon-btn:hover{color:#fff;border-color:rgba(212,175,55,.6);transform:translateY(-2px)}
@keyframes goldShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* MINE BANNER */
.banner-container{padding:4px 16px 0}
.gold-frame{position:relative;padding:1px;border-radius:24px;background:var(--gold-grad);background-size:220% 220%;animation:goldShift 8s ease infinite;box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 28px rgba(212,175,55,.10);cursor:pointer}
.fm-banner{border-radius:23px;padding:14px;display:flex;align-items:center;gap:12px;
  background:radial-gradient(220px 120px at 0% 0%,rgba(32,227,178,.16),transparent 70%),linear-gradient(160deg,#0c2f35 0%,#071e23 100%);position:relative;overflow:hidden;transition:transform .25s}
.fm-banner:active{transform:scale(.985)}
.vinyl{position:relative;width:58px;height:58px;flex-shrink:0;display:grid;place-items:center}
.vinyl .ring{position:absolute;inset:0;border-radius:50%;padding:2px;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite}
.vinyl .disc{position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#14424a 0%,#061a1e 72%);animation:spin 6s linear infinite;display:grid;place-items:center;overflow:hidden}
.vinyl .disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:spin 6s linear infinite;position:absolute;inset:0;opacity:.85}
.vinyl-label{position:relative;z-index:3;font-size:11px;font-weight:800;background:var(--gold-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.banner-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.live-row{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ff6b6b}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff4d4d;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.65)}70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.fm-banner .title{font-size:14.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-banner .subtitle{font-size:11px;color:#a9cdcd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine-btn{flex-shrink:0;border:none;cursor:pointer;padding:9px 16px;border-radius:14px;font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 6px 18px rgba(212,175,55,.35);z-index:3}

/* TABS */
.tab-section{display:flex;align-items:center;gap:26px;padding:22px 22px 14px}
.tab{position:relative;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding-bottom:8px;transition:.25s;display:flex;align-items:center;gap:6px;background:none;border:none;font-family:inherit}
.tab.active{color:#fff;font-size:17px;font-weight:700}
.tab.active::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;border-radius:2px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 5s ease infinite;box-shadow:0 0 12px rgba(212,175,55,.75)}
.tab-view{display:none}
.tab-view.active{display:block}
.hot-search-wrap{padding:0 16px 12px}
.hot-search-bar{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.22)}
.hot-search-bar:focus-within{border-color:rgba(212,175,55,.7);box-shadow:0 0 20px rgba(212,175,55,.22)}
.hot-search-bar i{color:var(--gold-2);font-size:13px}
.hot-search-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:13px}
.hot-search-bar input::placeholder{color:var(--muted)}

/* GRID */
.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.room-card{border-radius:22px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1);animation:fadeUp .45s ease both}
.room-card:hover{transform:translateY(-5px)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-inner{position:relative;border-radius:21px;overflow:hidden;background:#082024;aspect-ratio:1/1.12}
.card-inner img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.room-card:hover .card-inner img{transform:scale(1.07)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,18,21,.55) 0%,transparent 32%,transparent 42%,rgba(3,18,21,.92) 100%)}
.card-top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.badge-mine{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;padding:4px 9px;border-radius:8px;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite}
.badge-live{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:700;padding:4px 8px;border-radius:8px;color:#ffd9d9;background:rgba(200,30,30,.4);border:1px solid rgba(255,90,90,.5)}
.badge-live i{font-size:5px}
.room-info{position:absolute;left:0;right:0;bottom:0;padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px}
.room-title{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.room-stats{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:9px;font-weight:600;padding:3px 8px;border-radius:999px;color:#f4dc8a;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.count{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--teal)}
.count i{font-size:8.5px}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-icon{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--gold-2);background:linear-gradient(160deg,rgba(212,175,55,.18),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.35)}
.empty-state h3{font-size:16px;color:#fff}
.empty-state p{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:260px}
.skeleton{border-radius:22px;background:linear-gradient(110deg,#0a272d 8%,#0d3037 18%,#0a272d 33%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;aspect-ratio:1/1.12;border:1px solid rgba(212,175,55,.10)}
@keyframes shimmer{to{background-position:-200% 0}}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;align-items:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,28,33,.72),rgba(3,17,20,.96));backdrop-filter:blur(22px);z-index:600}
.bottom-nav::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 8s ease infinite;opacity:.55}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#5d868a;font-size:10px;font-weight:600;text-transform:uppercase;transition:.25s;padding:2px 12px;cursor:pointer}
.nav-item .nav-icon{width:40px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;transition:.25s}
.nav-item.active{color:var(--gold-2)}
.nav-item.active .nav-icon{background:linear-gradient(160deg,rgba(212,175,55,.20),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.4);color:#f4dc8a}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:1000;padding:20px;backdrop-filter:blur(8px)}
.modal-overlay.show{display:grid}
.modal-card{background:var(--panel);border:1px solid var(--gold-3);border-radius:24px;padding:24px;width:100%;max-width:350px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.9)}
.modal-card h3{color:var(--gold-2);font-size:18px;text-align:center;font-weight:700}
.modal-card label{font-size:12px;color:var(--muted);font-weight:600}
.modal-card input[type="text"],.modal-card select{background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:12px;color:#fff;outline:none;font-family:inherit;font-size:14px;width:100%}
.modal-card input:focus,.modal-card select:focus{border-color:var(--gold-2);box-shadow:0 0 10px rgba(212,175,55,0.3)}
.modal-card select option{background:#0a272d;color:#fff}
.upload-box{width:100px;height:100px;margin:0 auto;border:2px dashed rgba(212,175,55,0.5);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:rgba(255,255,255,0.02)}
.upload-box i{font-size:28px;color:var(--gold-2)}
.upload-box img{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0}
.modal-btn-group{display:flex;gap:10px;margin-top:10px}
.modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:0.3s}
.modal-btn.submit{background:var(--gold-grad);color:#1a1405}
.modal-btn.cancel{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.1)}
#cropperModal{z-index:2000}
#cropperImage{width:100%;display:block;border-radius:12px;max-height:400px}

::-webkit-scrollbar{width:0}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot, collection, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

/* ========== FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:564bb9c8a06f7c90b2b8b9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);      // Firestore
const rtdb = getDatabase(app);     // RTDB

const LINKS = {
  ownerRoom : "https://farjanaaktar1173-boop.github.io/Owner-room/",
  chat      : "https://farjanaaktar1173-boop.github.io/Chat/",
  me        : "https://farjanaaktar1173-boop.github.io/Me/"
};

/* ========== HELPERS ========== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ========== STATE ========== */
const me = { uid:"", name:"User", photo:"", email:"", country:"", voice:"", moiId:"", diamonds:0, room:null };
let meReady = false;
let allRooms = [];          // সব রুম (Firestore থেকে)
let myFollowing = [];        // যেগুলো আমি follow করেছি (roomId array)
let hotQuery = "";

/* ========== LOAD USER ========== */
async function initMe(){
  // ১. URL থেকে
  const p = new URLSearchParams(location.search);
  const urlUid = p.get("uid");
  if (urlUid){
    me.uid = urlUid;
    me.name = p.get("name") || "User";
    me.photo = p.get("photo") || "";
    me.email = p.get("email") || "";
    me.country = p.get("country") || "";
    me.voice = p.get("voice") || "";
    me.moiId = p.get("moiId") || "";
    history.replaceState({}, "", location.pathname);
  }
  // ২. localStorage
  if (!me.uid){
    try {
      const s = localStorage.getItem("moi_user");
      if (s){ Object.assign(me, JSON.parse(s)); }
    } catch(e){}
  }
  // ৩. Firebase Auth
  if (!me.uid){
    await new Promise(res => {
      const unsub = onAuthStateChanged(auth, u => {
        unsub();
        if (u){ me.uid = u.uid; me.name = u.displayName || "User"; me.photo = u.photoURL || ""; me.email = u.email || ""; }
        res();
      });
    });
  }

  if (!me.uid){
    $("userNameDisplay").textContent = "Not Logged In";
    $("userIdDisplay").textContent = "Please sign in";
    return false;
  }

  // ৪. Firestore থেকে fresh data
  try {
    const snap = await getDoc(doc(db, "users", me.uid));
    if (snap.exists()){
      const u = snap.data();
      me.name = u.name || me.name;
      me.photo = u.photo || u.avatar || me.photo;
      me.email = u.email || me.email;
      me.country = u.country || me.country;
      me.voice = u.voice || me.voice;
      me.moiId = u.moiId || me.moiId;
      me.diamonds = u.diamonds ?? 0;
    }
  } catch(e){ console.warn("user read:", e); }

  // ৫. localStorage backup
  try {
    localStorage.setItem("moi_user", JSON.stringify({
      uid:me.uid, name:me.name, photo:me.photo, email:me.email,
      country:me.country, voice:me.voice, moiId:me.moiId
    }));
  } catch(e){}

  meReady = true;
  return true;
}

function renderUser(){
  $("userNameDisplay").textContent = me.name || "User";
  $("userIdDisplay").textContent = "🆔 " + (me.moiId || me.uid.slice(0,8));
  if (me.photo){
    $("userAvatar").src = me.photo;
    $("vinylProfileImg").src = me.photo;
  }
}

/* ========== LIVE USER LISTENER (my room) ========== */
function listenMyUser(){
  onSnapshot(doc(db, "users", me.uid), snap => {
    if (!snap.exists()) return;
    const u = snap.data();
    me.room = u.room || null;
    renderBanner();
  });
}

/* ========== BANNER ========== */
function renderBanner(){
  if (me.room && me.room.name){
    $("bannerTitle").textContent = "📻 " + me.room.name;
    $("bannerSubtitle").textContent = me.room.country || "My Room";
    $("vinylLabel").textContent = (me.room.name || "FM").split(/\s+/)[0].slice(0,6).toUpperCase();
    if (me.room.logo) $("vinylProfileImg").src = me.room.logo;
    $("mineBtn").textContent = "Enter";
  } else {
    $("bannerTitle").textContent = "Create Your Room";
    $("bannerSubtitle").textContent = "Tap to setup your own room";
    $("vinylLabel").textContent = "FM";
    if (me.photo) $("vinylProfileImg").src = me.photo;
    $("mineBtn").textContent = "Mine";
  }
}

/* ========== MINE BANNER CLICK ========== */
$("fmBanner").addEventListener("click", () => {
  if (!meReady){ alert("একটু অপেক্ষা করুন..."); return; }
  if (me.room && me.room.name){
    location.href = LINKS.ownerRoom + "?room=" + me.uid;
  } else {
    $("roomModal").classList.add("show");
  }
});
$("mineBtn").addEventListener("click", e => {
  e.stopPropagation();
  if (me.room && me.room.name){
    location.href = LINKS.ownerRoom + "?room=" + me.uid;
  } else {
    $("roomModal").classList.add("show");
  }
});

/* ========== IMAGE CROP ========== */
let cropper = null;
const imageInput = $("modalImgInput");
const croppedPreview = $("croppedPreview");

$("uploadBox").addEventListener("click", () => imageInput.click());

imageInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    $("cropperImage").src = ev.target.result;
    $("cropperModal").classList.add("show");
    if (cropper) cropper.destroy();
    cropper = new Cropper($("cropperImage"), { aspectRatio:1, viewMode:1, autoCropArea:.85 });
  };
  reader.readAsDataURL(file);
});

$("cropSaveBtn").addEventListener("click", () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width:256, height:256 });
  const url = canvas.toDataURL("image/jpeg", 0.8);
  croppedPreview.src = url;
  croppedPreview.style.display = "block";
  $("uploadBox").querySelector("i").style.display = "none";
  $("cropperModal").classList.remove("show");
  cropper.destroy(); cropper = null;
});

$("cropCancelBtn").addEventListener("click", () => {
  $("cropperModal").classList.remove("show");
  if (cropper){ cropper.destroy(); cropper = null; }
  imageInput.value = "";
});

/* ========== CREATE ROOM ========== */
$("modalCloseBtn").addEventListener("click", () => $("roomModal").classList.remove("show"));

$("modalSubmitBtn").addEventListener("click", async () => {
  const name = $("modalGroupName").value.trim();
  const country = $("modalCountry").value;
  const logo = croppedPreview.src || "";

  if (!name){ alert("রুমের নাম দিন"); return; }

  const btn = $("modalSubmitBtn");
  const oldTxt = btn.innerHTML;
  btn.innerHTML = "Creating...";
  btn.disabled = true;

  const roomData = {
    name, country: country || "Unknown", logo,
    ownerUid: me.uid,
    ownerName: me.name,
    ownerPhoto: me.photo,
    topic: "🎧 Welcome to " + name + " 🎵",
    monthlyDiamonds: 0,
    createdAt: Date.now()
  };

  try {
    // Firestore-এ ইউজারের ভিতরে room সেভ
    await setDoc(doc(db, "users", me.uid), { room: roomData }, { merge: true });

    // Firestore-এ public room index (list-এর জন্য)
    await setDoc(doc(db, "rooms", me.uid), {
      ...roomData,
      id: me.uid,
      listeners: 0
    });

    // RTDB-তে presence সহ room info
    await setDoc(doc(db, "rooms", me.uid), { isLive: true }, { merge: true });

    // Owner Room-এ যাই
    setTimeout(() => {
      location.href = LINKS.ownerRoom + "?room=" + me.uid;
    }, 300);

  } catch(err){
    console.error(err);
    alert("সমস্যা: " + err.message);
    btn.innerHTML = oldTxt;
    btn.disabled = false;
  }
});

/* ========== LOAD ALL ROOMS (Firestore) ========== */
function listenRooms(){
  const q = query(collection(db, "rooms"), orderBy("listeners", "desc"), limit(50));
  onSnapshot(q, snap => {
    allRooms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // RTDB-তে লিসেনার কাউন্ট live sync
    allRooms.forEach(room => {
      onValue(ref(rtdb, `rooms/${room.id}/listeners`), s => {
        const cnt = s.exists() ? Object.keys(s.val()).length : 0;
        room.listeners = cnt;
        renderHot();
        renderFollowing();
      });
    });
    renderHot();
    renderFollowing();
  }, err => {
    console.error("rooms:", err);
    renderEmpty($("hotGrid"), "লোড হয়নি", "ইন্টারনেট চেক করুন");
  });
}

/* ========== LOAD MY FOLLOWING ========== */
function listenFollowing(){
  onSnapshot(doc(db, "users", me.uid), snap => {
    if (!snap.exists()) return;
    const u = snap.data();
    myFollowing = Object.keys(u.following || {});
    renderFollowing();
  });
}

/* ========== CARD HTML ========== */
function cardHTML(room){
  const title = esc(room.name || "Room");
  const tag = esc(room.country || "");
  const isMine = room.ownerUid === me.uid;
  const listeners = room.listeners || 0;
  const img = room.logo || `https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}`;
  const mineBadge = isMine ? `<span class="badge-mine"><i class="fa-solid fa-crown"></i> You</span>` : "";
  return `<div class="room-card gold-frame" data-id="${esc(room.id)}">
    <div class="card-inner">
      <img src="${esc(img)}" loading="lazy" onerror="this.src='https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}'">
      <div class="card-overlay"></div>
      <div class="card-top">${mineBadge}<span class="badge-live"><i class="fa-solid fa-circle"></i>LIVE</span></div>
      <div class="room-info">
        <div class="room-title">${title}</div>
        <div class="room-stats">
          <span class="tag">${tag}</span>
          <span class="count"><i class="fa-solid fa-headphones"></i> ${listeners}</span>
        </div>
      </div>
    </div>
  </div>`;
}

function renderEmpty(container, title, sub){
  container.innerHTML = `<div class="empty-state">
    <div class="empty-icon"><i class="fa-solid fa-satellite-dish"></i></div>
    <h3>${esc(title)}</h3><p>${esc(sub)}</p>
  </div>`;
}

/* ========== RENDER HOT ========== */
function renderHot(){
  const q = hotQuery.trim().toLowerCase();
  let list = allRooms;
  if (q){
    list = allRooms.filter(r =>
      (r.name || "").toLowerCase().includes(q) ||
      (r.country || "").toLowerCase().includes(q)
    );
  }
  if (!list.length){
    renderEmpty($("hotGrid"), q ? "কিছু পাওয়া যায়নি" : "এখনো কোনো রুম নেই",
      q ? "অন্য নাম দিয়ে খুঁজুন" : "উপরের Mine থেকে নিজের রুম তৈরি করুন");
    return;
  }
  $("hotGrid").innerHTML = list.map(cardHTML).join("");
}

/* ========== RENDER FOLLOWING ========== */
function renderFollowing(){
  const list = allRooms.filter(r => myFollowing.includes(r.id));
  if (!list.length){
    renderEmpty($("followingGrid"), "কোনো রুম নেই", "Hot ট্যাব থেকে পছন্দের রুম Follow করুন");
    return;
  }
  $("followingGrid").innerHTML = list.map(cardHTML).join("");
}

/* ========== CLICK ROOM ========== */
document.addEventListener("click", e => {
  const card = e.target.closest(".room-card");
  if (!card) return;
  const id = card.dataset.id;
  if (id) location.href = LINKS.ownerRoom + "?room=" + encodeURIComponent(id);
});

/* ========== TABS ========== */
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    const key = tab.dataset.tab;
    $("view-hot").classList.toggle("active", key === "hot");
    $("view-following").classList.toggle("active", key === "following");
  });
});

/* ========== SEARCH ========== */
$("hotSearchInput").addEventListener("input", e => {
  hotQuery = e.target.value;
  renderHot();
});

/* ========== BOTTOM NAV ========== */
$("navChat").addEventListener("click", () => {
  location.href = LINKS.chat;
});
$("navMe").addEventListener("click", () => {
  location.href = LINKS.me;
});
$("navRoom").addEventListener("click", () => {
  window.scrollTo({ top:0, behavior:"smooth" });
});

/* ========== INIT ========== */
(async () => {
  const ok = await initMe();
  if (!ok) return;
  renderUser();
  listenMyUser();
  listenRooms();
  listenFollowing();
  console.log("🏠 Homepage ready • UID:", me.uid);
})();
</script>
