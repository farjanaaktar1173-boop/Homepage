<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FM App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Outfit:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
:root{--bg-0:#031215;--bg-1:#061c21;--panel:#0a272d;--panel-2:#0d3037;--gold-1:#fff8dc;--gold-2:#f4dc8a;--gold-3:#d4af37;--gold-4:#9c7418;--gold-grad:linear-gradient(115deg,#fff8dc 0%,#f4dc8a 16%,#d4af37 34%,#8a6318 50%,#d4af37 66%,#f7e79c 84%,#fff8dc 100%);--teal:#20e3b2;--text:#eaf6f6;--muted:#7fa3a6;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Outfit','Hind Siliguri',sans-serif;background:radial-gradient(900px 600px at 50% -10%,#0d3b42 0%,transparent 60%),radial-gradient(700px 500px at 110% 100%,#123c33 0%,transparent 55%),#031215;color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:0;overflow-x:hidden}
.app-container{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;padding-bottom:110px;background:radial-gradient(600px 320px at 50% -5%,rgba(32,227,178,.10),transparent 65%),radial-gradient(500px 400px at 100% 40%,rgba(212,175,55,.06),transparent 60%),linear-gradient(180deg,#061c21 0%,#04161a 55%,#031114 100%);box-shadow:0 0 80px rgba(0,0,0,.8)}
.app-container::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(212,175,55,.18),transparent 30%,transparent 75%,rgba(212,175,55,.12));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px;pointer-events:none;z-index:5}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:22px 20px 14px;position:relative;z-index:6}
.profile-wrap{display:flex;align-items:center;gap:12px}
.avatar-ring{width:48px;height:48px;border-radius:50%;padding:2px;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 7s ease infinite;box-shadow:0 0 18px rgba(212,175,55,.35);flex-shrink:0}
.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #061c21}
.greet{display:flex;flex-direction:column;line-height:1.15}
.greet .hi{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.greet .name{font-size:15px;font-weight:600;background:var(--gold-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:goldShift 7s ease infinite}
.greet .uid{font-size:10px;color:var(--teal);letter-spacing:.05em;font-weight:500}
.head-actions{display:flex;gap:10px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;font-size:16px;color:#cfe9e8;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.22);backdrop-filter:blur(10px);cursor:pointer;transition:.25s}
.icon-btn:hover{color:#fff;border-color:rgba(212,175,55,.6);box-shadow:0 0 18px rgba(212,175,55,.25);transform:translateY(-2px)}
.gold-frame{position:relative;padding:1px;border-radius:24px;background:var(--gold-grad);background-size:220% 220%;animation:goldShift 8s ease infinite;box-shadow:0 0 0 1px rgba(212,175,55,.06),0 18px 40px rgba(0,0,0,.55),0 0 28px rgba(212,175,55,.10);cursor:pointer}
@keyframes goldShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.banner-container{padding:4px 16px 0}
.fm-banner{border-radius:23px;padding:14px;display:flex;align-items:center;gap:12px;background:radial-gradient(220px 120px at 0% 0%,rgba(32,227,178,.16),transparent 70%),radial-gradient(200px 140px at 100% 100%,rgba(212,175,55,.10),transparent 70%),linear-gradient(160deg,#0c2f35 0%,#071e23 100%);position:relative;overflow:hidden;transition:transform .25s}
.fm-banner:active{transform:scale(.985)}
.fm-banner::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);transform:skewX(-18deg);animation:sweep 5.5s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{left:-60%}55%{left:130%}100%{left:130%}}
.vinyl{position:relative;width:58px;height:58px;flex-shrink:0;display:grid;place-items:center}
.vinyl .ring{position:absolute;inset:0;border-radius:50%;padding:2px;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 0 16px rgba(212,175,55,.35)}
.vinyl .disc{position:absolute;inset:3px;border-radius:50%;background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.055) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,#14424a 0%,#061a1e 72%);animation:spin 6s linear infinite;display:grid;place-items:center;overflow:hidden}
.vinyl .disc img{width:100%;height:100%;object-fit:cover;border-radius:50%;animation:spin 6s linear infinite;position:absolute;inset:0;z-index:1;opacity:.8}
.vinyl .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,rgba(255,255,255,.13) 45deg,transparent 95deg,transparent 190deg,rgba(212,175,55,.22) 235deg,transparent 290deg);z-index:2;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl-label{position:relative;z-index:3;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--gold-grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 12px rgba(212,175,55,.5)}
.banner-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.live-row{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#ff6b6b}
.live-dot{width:6px;height:6px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.65)}70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.fm-banner .title{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ffffff}
.fm-banner .subtitle{font-size:11px;color:#a9cdcd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm-banner .listeners{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:var(--teal);margin-top:1px}
.mine-btn{flex-shrink:0;position:relative;border:none;cursor:pointer;padding:9px 16px;border-radius:14px;font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 6px 18px rgba(212,175,55,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:.25s;z-index:3}
.mine-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(212,175,55,.5),inset 0 1px 0 rgba(255,255,255,.7)}
.mine-btn:active{transform:translateY(0) scale(.97)}
.banner-progress{position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;pointer-events:none}
.banner-progress span{display:block;height:100%;width:38%;border-radius:2px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 5s ease infinite}
.tab-section{display:flex;align-items:center;gap:26px;padding:22px 22px 14px}
.tab{position:relative;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;padding-bottom:8px;transition:.25s;display:flex;align-items:center;gap:6px;background:none;border:none;font-family:inherit}
.tab:hover{color:#bcd9d8}
.tab.active{color:#fff;font-size:17px;font-weight:700}
.tab.active::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;border-radius:2px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 5s ease infinite;box-shadow:0 0 12px rgba(212,175,55,.75)}
.tab .fire{font-size:13px;filter:drop-shadow(0 0 6px rgba(255,140,0,.8))}
.tab-view{display:none}
.tab-view.active{display:block}
.hot-search-wrap{padding:0 16px 12px}
.hot-search-bar{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(212,175,55,.22);transition:.25s}
.hot-search-bar:focus-within{border-color:rgba(212,175,55,.7);box-shadow:0 0 20px rgba(212,175,55,.22)}
.hot-search-bar i{color:var(--gold-2);font-size:13px}
.hot-search-bar input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-family:inherit;font-size:13px}
.hot-search-bar input::placeholder{color:var(--muted)}
.hot-search-bar .clear-x{cursor:pointer;display:none}
.hot-stats-row{display:flex;gap:10px;padding:0 16px 14px}
.hot-stat{flex:1;padding:10px 8px;border-radius:14px;background:linear-gradient(160deg,rgba(32,227,178,.10),rgba(32,227,178,.02));border:1px solid rgba(32,227,178,.28);text-align:center}
.hot-stat .num{font-size:17px;font-weight:800;color:#fff;line-height:1}
.hot-stat .lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.grid-container{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.room-card{border-radius:22px;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:fadeUp .45s ease both}
.room-card:hover{transform:translateY(-5px);box-shadow:0 0 0 1px rgba(212,175,55,.10),0 22px 45px rgba(0,0,0,.6),0 0 34px rgba(212,175,55,.22)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card-inner{position:relative;border-radius:21px;overflow:hidden;background:#082024;aspect-ratio:1/1.12}
.card-inner img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.8,.2,1);filter:saturate(1.05) contrast(1.05)}
.room-card:hover .card-inner img{transform:scale(1.07)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,18,21,.55) 0%,transparent 32%,transparent 42%,rgba(3,18,21,.92) 100%)}
.card-top{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.badge-top{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:8px;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.badge-mine{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:8px;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.badge-live{display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:700;letter-spacing:.1em;padding:4px 8px;border-radius:8px;color:#ffd9d9;background:rgba(200,30,30,.35);border:1px solid rgba(255,90,90,.45);backdrop-filter:blur(6px)}
.badge-live i{font-size:5px}
.badge-rank{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#1a1405;background:var(--gold-grad);background-size:200% 200%;animation:goldShift 6s ease infinite;box-shadow:0 3px 12px rgba(0,0,0,.6),0 0 14px rgba(212,175,55,.55);z-index:3}
.room-info{position:absolute;left:0;right:0;bottom:0;padding:10px 11px 11px;display:flex;flex-direction:column;gap:7px}
.room-title{font-size:12.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.room-stats{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:9px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;color:#f4dc8a;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70px}
.count{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--teal);text-shadow:0 0 10px rgba(32,227,178,.4)}
.count i{font-size:8.5px}
.skeleton{border-radius:22px;background:linear-gradient(110deg,#0a272d 8%,#0d3037 18%,#0a272d 33%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;aspect-ratio:1/1.12;border:1px solid rgba(212,175,55,.10)}
@keyframes shimmer{to{background-position:-200% 0}}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-state .empty-icon{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--gold-2);background:linear-gradient(160deg,rgba(212,175,55,.18),rgba(212,175,55,.03));border:1px solid rgba(212,175,55,.35);box-shadow:0 0 30px rgba(212,175,55,.18)}
.empty-state h3{font-size:16px;color:#fff;font-weight:600}
.empty-state p{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:260px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;justify-content:space-around;align-items:center;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(6,28,33,.72),rgba(3,17,20,.96));backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);z-index:50}
.bottom-nav::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 8s ease infinite;opacity:.55}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#5d868a;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:.25s;position:relative;padding:2px 12px;cursor:pointer}
.nav-item .nav-icon{position:relative;display:grid;place-items:center;width:40px;height:34px;border-radius:12px;font-size:18px;transition:.25s}
.nav-item:hover{color:#9dc3c4}
.nav-item.active{color:var(--gold-2)}
.nav-item.active .nav-icon{background:linear-gradient(160deg,rgba(212,175,55,.20),rgba(212,175,55,.05));border:1px solid rgba(212,175,55,.4);box-shadow:0 0 20px rgba(212,175,55,.28),inset 0 1px 0 rgba(255,255,255,.10);color:#f4dc8a}
.nav-item.active::after{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:24px;height:2px;border-radius:2px;background:var(--gold-grad);background-size:200% 100%;animation:goldShift 5s ease infinite;box-shadow:0 0 12px rgba(212,175,55,.9)}
.badge{position:absolute;top:-3px;right:-2px;min-width:18px;height:18px;padding:0 5px;display:none;place-items:center;border-radius:999px;font-size:10px;font-weight:800;font-style:normal;color:#fff;background:linear-gradient(145deg,#ff5b5b,#c81e1e);border:2px solid #062026;box-shadow:0 0 10px rgba(255,70,70,.8)}
.badge.show{display:grid}

/* ===== CHAT FULL-PAGE OVERLAY ===== */
#chatOverlay{position:fixed;inset:0;z-index:500;display:none;flex-direction:column;background:#0a0616;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.3,1);}
#chatOverlay.show{display:flex;transform:translateY(0)}
#chatOverlay iframe{flex:1;width:100%;border:none;display:block;background:#0a0616}
.chat-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0a0616;color:#d8b4fe;z-index:2;transition:opacity .3s}
.chat-loading.hidden{opacity:0;pointer-events:none}
.chat-spinner{width:38px;height:38px;border:3px solid rgba(168,85,247,.25);border-top-color:#a855f7;border-radius:50%;animation:spin .9s linear infinite}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:1000;padding:20px;backdrop-filter:blur(8px)}
.modal-overlay.show{display:grid}
.modal-card{background:var(--panel);border:1px solid var(--gold-3);border-radius:24px;padding:24px;width:100%;max-width:350px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.9),0 0 30px rgba(212,175,55,.2);animation:fadeUp .3s ease}
.modal-card h3{color:var(--gold-2);font-size:18px;text-align:center;margin-bottom:5px;font-weight:700}
.modal-card label{font-size:12px;color:var(--muted);font-weight:600}
.modal-card input[type="text"],.modal-card select{background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:12px;color:#fff;outline:none;font-family:inherit;font-size:14px;transition:0.3s;width:100%}
.modal-card input[type="text"]:focus,.modal-card select:focus{border-color:var(--gold-2);box-shadow:0 0 10px rgba(212,175,55,0.3)}
.modal-card select option{background:#0a272d;color:#fff}
.modal-card input[readonly]{background:rgba(212,175,55,0.1);color:var(--gold-2);font-weight:700;text-align:center}
.upload-box{width:100px;height:100px;margin:0 auto;border:2px dashed rgba(212,175,55,0.5);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;background:rgba(255,255,255,0.02);transition:0.3s}
.upload-box:hover{border-color:var(--gold-2);background:rgba(212,175,55,0.05)}
.upload-box .fa-plus{font-size:28px;color:var(--gold-2)}
.upload-box img{width:100%;height:100%;object-fit:cover;display:none}
.modal-btn-group{display:flex;gap:10px;margin-top:10px}
.modal-btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:0.3s}
.modal-btn.submit{background:var(--gold-grad);color:#1a1405;box-shadow:0 4px 15px rgba(212,175,55,0.4)}
.modal-btn.submit:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,0.6)}
.modal-btn.cancel{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.1)}
.modal-btn.cancel:hover{background:rgba(255,255,255,0.2)}
#cropperModal{z-index:2000}
#cropperModal .modal-card{max-width:90%}
#cropperImage{width:100%;display:block;border-radius:12px;max-height:400px;object-fit:contain}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>

<div class="app-container">

  <div class="top-bar">
    <div class="profile-wrap">
      <div class="avatar-ring"><img id="userAvatar" src="https://i.pravatar.cc/120?img=12" alt="profile"></div>
      <div class="greet">
        <span class="name" id="userNameDisplay">Loading…</span>
        <span class="uid" id="userIdDisplay">UID: ---</span>
      </div>
    </div>
    <div class="head-actions">
      <div class="icon-btn"><i class="fa-solid fa-magnifying-glass"></i></div>
      <div class="icon-btn"><i class="fa-regular fa-bell"></i></div>
    </div>
  </div>

  <div class="banner-container">
    <div class="gold-frame" id="bannerBorder">
      <div class="fm-banner" id="fmBanner" role="link" tabindex="0">
        <div class="vinyl" id="vinylArea">
          <div class="ring"></div>
          <div class="disc"><img id="vinylProfileImg" src="https://i.pravatar.cc/120?img=12" alt="profile"></div>
          <span class="vinyl-label" id="vinylLabel">FM</span>
        </div>
        <div class="banner-info">
          <div class="live-row"><span class="live-dot"></span> Personal Room</div>
          <div class="title" id="bannerTitle">Create Your Room</div>
          <div class="subtitle" id="bannerSubtitle">Tap to setup your personal room</div>
          <div class="listeners" id="bannerListeners"><i class="fa-solid fa-headphones"></i> Tap to enter</div>
        </div>
        <button class="mine-btn" id="mineBtn">Mine</button>
        <div class="banner-progress"><span></span></div>
      </div>
    </div>
  </div>

  <div class="tab-section">
    <button class="tab active" data-tab="hot"><span class="fire">🔥</span> Hot</button>
    <button class="tab" data-tab="following">Following</button>
  </div>

  <div class="tab-view active" id="view-hot">
    <div class="hot-search-wrap">
      <div class="hot-search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="hotSearchInput" placeholder="নাম, দেশ বা রুম আইডি খুঁজুন...">
        <i class="fa-solid fa-xmark clear-x" id="hotClearSearch"></i>
      </div>
    </div>
    <div class="hot-stats-row">
      <div class="hot-stat"><div class="num" id="hotStatRooms">0</div><div class="lbl">Rooms</div></div>
      <div class="hot-stat"><div class="num" id="hotStatUsers">0</div><div class="lbl">Live</div></div>

/* =========================================================
   USER STATE
   ========================================================= */
const user = { uid:"", name:"User", photo:"", email:"", country:"", voice:"", moiId:"", myRoomUid:"" };
let userReady = false;

function readFromURL() {
  const p = new URLSearchParams(location.search);
  const uid = p.get("uid");
  if (!uid) return null;
  const data = {
    uid, name:p.get("name")||"User", photo:p.get("photo")||"",
    email:p.get("email")||"", country:p.get("country")||"",
    voice:p.get("voice")||"", moiId:p.get("moiId")||""
  };
  history.replaceState({}, "", location.pathname);
  return data;
}

async function initUser() {
  let baseUser = readFromURL();
  if (!baseUser) {
    try { const stored = localStorage.getItem("moi_user"); if (stored) baseUser = JSON.parse(stored); } catch(e){}
  }
  if (!baseUser || !baseUser.uid) {
    baseUser = await new Promise(res => {
      const unsub = onAuthStateChanged(auth, u => {
        unsub();
        if (u) res({ uid:u.uid, name:u.displayName||"User", photo:u.photoURL||"", email:u.email||"" });
        else res(null);
      });
    });
  }
  if (!baseUser || !baseUser.uid) {
    $("userNameDisplay").textContent = "Not Logged In";
    $("userIdDisplay").textContent = "Please sign in";
    return false;
  }

  Object.assign(user, baseUser);

  try {
    const snap = await get(ref(db, "users/" + user.uid));
    if (snap.exists()) {
      const fresh = snap.val();
      user.name = fresh.name || user.name;
      user.photo = fresh.photo || fresh.avatar || user.photo;
      user.email = fresh.email || user.email;
      user.country = fresh.country || user.country;
      user.voice = fresh.voice || user.voice;
      user.moiId = fresh.moiId || user.moiId;
      user.myRoomUid = fresh.myRoomUid || "";
    }
  } catch(e){ console.warn("users read error:", e); }

  try {
    localStorage.setItem("moi_user", JSON.stringify({
      uid:user.uid, name:user.name, photo:user.photo, email:user.email,
      country:user.country, voice:user.voice, moiId:user.moiId
    }));
  } catch(e){}

  userReady = true;
  return true;
}

function renderUser() {
  $("userNameDisplay").textContent = user.name || "User";
  $("userIdDisplay").textContent = "UID: " + (user.moiId || user.uid.slice(0,8));
  if (user.photo) {
    $("userAvatar").src = user.photo;
    $("vinylProfileImg").src = user.photo;
  }
}

/* =========================================================
   CHAT UNREAD BADGE (NEW)
   ========================================================= */
function initChatBadge() {
  if (!user.uid) return;
  onValue(ref(db, "userChatMeta/" + user.uid), snap => {
    const data = snap.val() || {};
    let total = 0;
    Object.values(data).forEach(m => { total += Number(m.unread || 0); });
    const badge = $("chatBadge");
    if (total > 0) {
      badge.textContent = total > 99 ? "99+" : total;
      badge.classList.add("show");
    } else {
      badge.classList.remove("show");
    }
  });
}

/* =========================================================
   CHAT OVERLAY (NEW)
   ========================================================= */
window.openChat = (targetUid, targetName) => {
  const overlay = $("chatOverlay");
  const frame = $("chatFrame");
  const loading = $("chatLoading");
  loading.classList.remove("hidden");

  let url = LINKS.chat;
  if (targetUid) {
    const u = new URL(LINKS.chat);
    u.searchParams.set("targetUid", targetUid);
    if (targetName) u.searchParams.set("targetName", targetName);
    url = u.toString();
  }
  frame.src = url;
  frame.onload = () => loading.classList.add("hidden");
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
};

window.closeChat = () => {
  $("chatOverlay").classList.remove("show");
  document.body.style.overflow = "";
  setTimeout(() => { $("chatFrame").src = "about:blank"; }, 300);
};

/* Chat iframe থেকে message আসতে পারে (back button ইত্যাদি) */
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d) return;
  if (d.type === "CHAT_CLOSE") closeChat();
  if (d.type === "CHAT_UNREAD") {
    const badge = $("chatBadge");
    const n = Number(d.total || 0);
    if (n > 0) { badge.textContent = n > 99 ? "99+" : n; badge.classList.add("show"); }
    else badge.classList.remove("show");
  }
});

  if (!user.uid) return;

let cropper;
const imageInput = $("modalImgInput");
const cropperModal = $("cropperModal");
const cropperImage = $("cropperImage");

const cropCancelBtn = $("cropCancelBtn");

uploadBox.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (event) => {
      cropperImage.src = event.target.result;
      cropperModal.classList.add('show');
      if (cropper) cropper.destroy();
      cropper = new Cropper(cropperImage, { aspectRatio:1, viewMode:1, background:false, autoCropArea:0.8 });
    };
    reader.readAsDataURL(file);
  }
});

cropSaveBtn.addEventListener('click', () => {
  if (!cropper) return;
  const canvas = cropper.getCroppedCanvas({ width:256, height:256 });
  const croppedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
  croppedPreview.src = croppedDataUrl;
  croppedPreview.style.display = 'block';
  uploadBox.querySelector('.fa-plus').style.display = 'none';
  cropperModal.classList.remove('show');
  cropper.destroy();
  cropper = null;
});

    const num = Math.floor(100000 + Math.random() * 900000).toString();
    const snap = await get(ref(db, "rooms/" + num + "/info"));
    if (!snap.exists()) return num;

function formatCount(n){
  n = Number(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(2).replace(/\.00$/,'') + 'K';
  return String(n);
}

function hotCardHTML(room, rank){
  const title = esc(room.name || "Untitled Room");
  const tag = esc(room.country || "Room");
  const isMine = userReady && room.ownerUid === user.uid;
  const listeners = Number(room.listeners || 0);
  const img = room.logo || `https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}`;
  const mineBadge = isMine ? `<span class="badge-mine"><i class="fa-solid fa-crown"></i> You</span>` : "";
  const rankBadge = (rank <= 3 && listeners > 0) ? `<div class="badge-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : '🥉'}</div>` : "";
  return `
    <div class="room-card gold-frame" data-id="${esc(room.id)}">
      <div class="card-inner">
        ${rankBadge}
        <img src="${esc(img)}" alt="${title}" loading="lazy"
             onerror="this.onerror=null;this.src='https://picsum.photos/400/460?random=${encodeURIComponent(room.id)}'">
        <div class="card-overlay"></div>
        <div class="card-top">${mineBadge}<span class="badge-live"><i class="fa-solid fa-circle"></i>LIVE</span></div>
        <div class="room-info">
          <div class="room-title">${title}</div>
          <div class="room-stats">
            <span class="tag">${tag}</span>
            <span class="count"><i class="fa-solid fa-headphones"></i> ${formatCount(listeners)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderHotRooms(){
  const q = hotQuery.trim().toLowerCase();
  let list = allRooms;
  if (q) {
    list = allRooms.filter(r =>
      (r.name || "").toLowerCase().includes(q) ||
      (r.country || "").toLowerCase().includes(q) ||
      (r.id || "").toLowerCase().includes(q) ||
      (r.ownerName || "").toLowerCase().includes(q)
    );
  }
  if (!list.length){
    if (q) renderHotEmpty("কিছু পাওয়া যায়নি", "অন্য নাম বা দেশ দিয়ে খুঁজুন।");
    else renderHotEmpty("এখনো কোনো রুম নেই", "উপরের Mine থেকে নিজের রুম তৈরি করুন।");
    return;
  }
  hotGrid.innerHTML = list.map((r, i) => hotCardHTML(r, i + 1)).join("");
}

hotGrid.addEventListener("click", (e) => {
  const card = e.target.closest(".room-card");
  if (!card) return;
  const id = card.dataset.id;
  if (!id) return;
  location.href = LINKS.ownerRoom + "?room=" + encodeURIComponent(id);
});

onValue(ref(db, "rooms"), (snap) => {
  const data = snap.val() || {};
  allRooms = Object.entries(data).map(([id, v]) => {
    const info = v?.info || {};
    const listeners = v?.listeners ? Object.keys(v.listeners).length : 0;
    return {
      id,
      name: info.name || "Untitled",
      logo: info.logo || null,
      country: info.country || "",
      ownerUid: info.owner?.uid || "",
      ownerName: info.owner?.name || "",
      ownerAvatar: info.owner?.avatar || "",
      createdAt: info.createdAt || 0,
      listeners
    };
  }).sort((a, b) => {
    if (b.listeners !== a.listeners) return b.listeners - a.listeners;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  $("hotStatRooms").textContent = allRooms.length;
  $("hotStatUsers").textContent = allRooms.reduce((sum, r) => sum + r.listeners, 0);
  $("hotStatMine").textContent = userReady ? allRooms.filter(r => r.ownerUid === user.uid).length : 0;
  renderHotRooms();
}, (err) => {
  console.error(err);
  renderHotEmpty("ডেটা লোড হয়নি", "ইন্টারনেট চেক করুন।");
});

});

        <div class="card-top">${liveBadge}</div>
        <div class="room-info">
          <div class="room-title">${title}</div>
          <div class="room-stats">
            <span class="tag">${tag}</span>
            <span class="count"><i class="fa-solid fa-droplet"></i> ${formatCount(listeners)}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderFollowing(){
  if (!allRooms.length){ renderFollowingEmpty("কোনো Follow রুম নেই।", "Hot ট্যাবে গিয়ে পছন্দের রুম ফলো করুন।"); return; }
  grid.innerHTML = allRooms.map(roomCardHTML).join("");
}

grid.addEventListener("click", (e) => {
  const card = e.target.closest(".room-card");
  if (!card) return;
  const roomId = card.dataset.id;
  if (!roomId) return;
  location.href = `${LINKS.ownerRoom}?room=${encodeURIComponent(roomId)}`;
});

/* =========================================================
   BOTTOM NAV
   ========================================================= */
$("navChat").addEventListener("click", () => openChat());
$("navMe").addEventListener("click", () => location.href = LINKS.me);
$("navRoom").addEventListener("click", () => window.scrollTo({ top:0, behavior:"smooth" }));

/* =========================================================
   INIT
   ========================================================= */
(async () => {
  const ok = await initUser();
  if (!ok) return;
  renderUser();
  loadMyRoom();
  initChatBadge();

  setTimeout(() => {
    $("hotStatMine").textContent = allRooms.filter(r => r.ownerUid === user.uid).length;
    renderHotRooms();
    renderFollowing();
  }, 300);

  document.querySelector('[data-tab="following"]').addEventListener("click", renderFollowing);
})();

</script>

</body>
</html>
